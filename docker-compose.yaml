services:
  mongodb:
    image: ${DOCKER_MONGODB_IMAGE:-mongo}
    restart: always
    networks:
      - main
    volumes:
     - mongodata:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ADMINUSERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMINPASSWORD}

  mongo-express:
    image: ${DOCKER_MONGOEXPRESS_IMAGE:-mongo-express}
    restart: unless-stopped
    ports:
      - ${MONGOEXPRESS_PORT_EXTERNAL}:8081
    networks:
      - main
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_SERVER: "mongodb"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGOEXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGOEXPRESS_PASSWORD:-pass}

  influxdb:
    image: ${DOCKER_INFLUXDB_IMAGE:-influxdb}
    restart: always
    networks:
      - main
    ports:
      - ${INFLUXDB_PORT_EXTERNAL:-127.0.0.1:8086}:8086
    volumes:
      - influxdata:/var/lib/influxdb2
      # - ./config/influxdb-config.yml:/etc/influxdb2/config.yml
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}

  rabbitmq:
    build:
      context: ./rabbitmq
      args:
        DOCKER_RABBITMQ_IMAGE: ${DOCKER_RABBITMQ_IMAGE:-rabbitmq:management}

    restart: always
    ports:
      - ${MQTT_PORT_EXTERNAL}:1883
      - ${MQTTS_PORT_EXTERNAL:-8883}:8883
      - ${MQTT_MANAGEMENT_PORT_EXTERNAL:-8072}:15672
    networks:
      - main
    environment:
      MQTTAUTH_SHARED_SECRET: ${MQTTAUTH_SHARED_SECRET:-terpcontrol}
      # Base64-encoded PEM cert/key (and optional CA) enable the TLS listener on 8883.
      # Leave empty to run with the plaintext listener only.
      MQTTS_CERT_PEM_B64: ${MQTTS_CERT_PEM_B64:-}
      MQTTS_KEY_PEM_B64: ${MQTTS_KEY_PEM_B64:-}
      MQTTS_CA_PEM_B64: ${MQTTS_CA_PEM_B64:-}

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args:
        API_URL_EXTERNAL: ${API_URL_EXTERNAL}
        DOCKER_NGINX_IMAGE: ${DOCKER_NGINX_IMAGE:-nginx:1-alpine}
        DOCKER_NODE_WEBAPP_IMAGE: ${DOCKER_NODE_BUILD_IMAGE:-node:20-alpine}
        CUSTOM_LINKS_HTML: ${CUSTOM_LINKS_HTML:-}
    restart: always
    ports:
      - ${WEBAPP_PORT_EXTERNAL}:80
    networks:
      - main

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        DOCKER_NODE_SERVER_IMAGE: ${DOCKER_NODE_SERVER_IMAGE:-node:20-alpine}
    restart: always
    links:
     - mongodb
     - influxdb
     - rabbitmq
    ports:
      - ${API_PORT_EXTERNAL}:8081
      # UDP ports the Terp Cam client binds, which have to be published: the
      # camera's first reply comes from a port we never sent to, so the bridge
      # has no state for it and drops it unless the port is forwarded in.
      - ${TERPCAM_P2P_PORTS_EXTERNAL_START:-32200}-${TERPCAM_P2P_PORTS_EXTERNAL_END:-32209}:${TERPCAM_P2P_PORTS_EXTERNAL_START:-32200}-${TERPCAM_P2P_PORTS_EXTERNAL_END:-32209}/udp
    networks:
      - main
    environment:
      SECRET_KEY: ${TOKEN_SECRET_KEY}
      PORT: 8081
      API_URL_EXTERNAL: ${API_URL_EXTERNAL}
      # Same numbers as the published range above: both sides must match.
      TERPCAM_P2P_PORTS_START: ${TERPCAM_P2P_PORTS_EXTERNAL_START:-32200}
      TERPCAM_P2P_PORTS_END: ${TERPCAM_P2P_PORTS_EXTERNAL_END:-32209}
      TERPCAM_RENDEZVOUS_HOSTS: ${TERPCAM_RENDEZVOUS_HOSTS:-}
      # A stack hosted alongside its cameras is reachable at MQTT_HOST_EXTERNAL,
      # so that is the default. Only a private address is ever advertised.
      TERPCAM_ADVERTISE_ADDRESS: ${TERPCAM_ADVERTISE_ADDRESS:-${MQTT_HOST_EXTERNAL:-}}
      DB_HOST: "mongodb"
      DB_PORT: "27017"
      DB_DATABASE: ${MONGODB_DATABASE}
      DB_USER: ${MONGODB_ADMINUSERNAME}
      DB_PASSWORD: ${MONGODB_ADMINPASSWORD}
      MQTT_URL: "rabbitmq"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_HOST: 'influxdb'
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN}
      LOG_FORMAT: ${SERVER_LOG_FORMAT:-combined}
      LOG_DIR: "/var/log/terpcontrol"
      ENABLE_SELF_REGISTRATION: ${ENABLE_SELF_REGISTRATION}
      SELF_REGISTRATION_PASSWORD: ${SELF_REGISTRATION_PASSWORD}
      ADMINUSER_USERNAME: ${ADMINUSER_USERNAME}
      ADMINUSER_PASSWORD: ${ADMINUSER_PASSWORD}
      REQUIRE_ACTIVATION: ${REQUIRE_ACTIVATION}
      SMTP_SENDER: ${SMTP_SENDER}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MQTTAUTH_SHARED_SECRET: ${MQTTAUTH_SHARED_SECRET:-terpcontrol}
    # /readycheck answers 200 only once the database is reachable and the admin
    # account has been seeded, which is what this stack means by ready to serve;
    # `/` would answer while the server is still no use to anybody. node rather
    # than curl or wget, because node is the one thing the image is certain to
    # have. The start period covers the first build of the modules and the wait
    # for mongodb, and failures during it do not count.
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081/readycheck').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  main:
    driver: bridge

volumes:
  mongodata:
    external: ${DOCKER_MONGODATA_EXTERNAL:-false}
    name: ${DOCKER_MONGODATA_VOLUME:-${COMPOSE_PROJECT_NAME}_mongodata}
  influxdata:
    external: ${DOCKER_INFLUXDATA_EXTERNAL:-false}
    name: ${DOCKER_INFLUXDATA_VOLUME:-${COMPOSE_PROJECT_NAME}_influxdata}
