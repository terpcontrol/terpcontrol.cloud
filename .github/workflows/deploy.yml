name: Deploy

# Every run drives three tracks:
#
#   cloud      staging-cloud    -> production-cloud
#   firmware   staging-firmware -> production-firmware
#   garmin     garmin
#
# Each job reads its host, path and SSH key from the GitHub environment it is
# named after, and rsyncs the repo there itself. Jobs of one run all sync the
# same commit, so those sharing a host do not put each other out of step.
#
# A track only moves on when its own staging step succeeded, and never waits for
# another track. That is what keeps firmware unattended: the single job a human
# holds back is production-cloud, so required reviewers belong on that
# environment and nowhere else. The one edge across tracks is staging-firmware
# following staging-cloud - the firmware is built against the server it uploads
# to, so staging is brought up to date first.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      description:
        description: 'Firmware description suffix. Prefixed with short commit SHA; final FW_UPLOAD_VERSION is "<sha>-<this>". Max 55 chars, [A-Za-z0-9._-]. Leave blank to auto-derive a slug from the commit subject.'
        required: false
        type: string
        default: ''
      hardwares:
        description: 'Firmware variants to build (space-separated). Leave blank to auto-detect from changed paths. Use "none" to skip firmware.'
        required: false
        type: string
        default: ''
      skip_deploy:
        description: 'Skip webapp/server deploy step'
        required: false
        type: boolean
        default: false
      build_garmin:
        description: 'Build the Garmin Connect IQ app even when nothing under garmin/ changed'
        required: false
        type: boolean
        default: false

env:
  ALL_HARDWARES: 'fridge controller plug fan light'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      hardwares: ${{ steps.resolve.outputs.hardwares }}
      firmware_needed: ${{ steps.resolve.outputs.firmware_needed }}
      garmin_needed: ${{ steps.resolve.outputs.garmin_needed }}
      description: ${{ steps.resolve.outputs.description }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'firmware/src/**'
              - 'firmware/include/**'
              - 'firmware/lib/**'
              - 'firmware/scripts/**'
              - 'firmware/boards/**'
              - 'firmware/platformio.ini'
              - 'firmware/default_*'
              - 'firmware/fg_partitions.csv'
              - 'firmware/pioenv.py'
              - 'fw-buildcontainer/**'
              - 'build-fw.sh'
            fridge:
              - 'firmware/src_hwtype/fridge/**'
            controller:
              - 'firmware/src_hwtype/controller/**'
            plug:
              - 'firmware/src_hwtype/plug/**'
            fan:
              - 'firmware/src_hwtype/fan/**'
            light:
              - 'firmware/src_hwtype/light/**'
            garmin:
              - 'garmin/**'
              - 'garmin-buildcontainer/**'
              - 'build-garmin.sh'

      - name: Resolve hardwares + description
        id: resolve
        env:
          INPUT_HARDWARES: ${{ inputs.hardwares }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          INPUT_BUILD_GARMIN: ${{ inputs.build_garmin }}
          CHG_GARMIN: ${{ steps.changes.outputs.garmin }}
          CHG_SHARED: ${{ steps.changes.outputs.shared }}
          CHG_FRIDGE: ${{ steps.changes.outputs.fridge }}
          CHG_CONTROLLER: ${{ steps.changes.outputs.controller }}
          CHG_PLUG: ${{ steps.changes.outputs.plug }}
          CHG_FAN: ${{ steps.changes.outputs.fan }}
          CHG_LIGHT: ${{ steps.changes.outputs.light }}
        run: |
          set -euo pipefail

          # --- Hardwares ---
          if [ "${INPUT_HARDWARES}" = "none" ]; then
            HW=""
          elif [ -n "${INPUT_HARDWARES}" ]; then
            HW="${INPUT_HARDWARES}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            HW="${ALL_HARDWARES}"
          elif [ "${CHG_SHARED}" = "true" ]; then
            HW="${ALL_HARDWARES}"
          else
            HW=""
            [ "${CHG_FRIDGE}" = "true" ]     && HW="$HW fridge"
            [ "${CHG_CONTROLLER}" = "true" ] && HW="$HW controller"
            [ "${CHG_PLUG}" = "true" ]       && HW="$HW plug"
            [ "${CHG_FAN}" = "true" ]        && HW="$HW fan"
            [ "${CHG_LIGHT}" = "true" ]      && HW="$HW light"
          fi
          HW="$(echo "$HW" | xargs || true)"

          if [ -z "$HW" ]; then
            echo "firmware_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "firmware_needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "hardwares=$HW" >> "$GITHUB_OUTPUT"
          echo "Hardwares resolved: '$HW'"

          # --- Garmin app ---
          # Only rebuilt when something under garmin/ moved, or when explicitly
          # requested — the .iq is uploaded to the store by hand anyway.
          if [ "${INPUT_BUILD_GARMIN}" = "true" ] || [ "${CHG_GARMIN}" = "true" ]; then
            GARMIN_NEEDED=true
          else
            GARMIN_NEEDED=false
          fi
          echo "garmin_needed=$GARMIN_NEEDED" >> "$GITHUB_OUTPUT"
          echo "Garmin build needed: '$GARMIN_NEEDED'"

          # --- Description ---
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ -n "${INPUT_DESCRIPTION}" ]; then
            SUFFIX="${INPUT_DESCRIPTION}"
          else
            # Auto-slug from commit subject: strip trailing "(#NNN)", lowercase,
            # replace any run of non-[a-z0-9._-] with a single dash, trim dashes,
            # and cap at 55 chars so "<sha>-<slug>" fits the 63-char limit.
            SUBJECT="$(git log -1 --format=%s "${GITHUB_SHA}")"
            SUFFIX="$(printf '%s' "$SUBJECT" \
              | sed -E 's/[[:space:]]*\(#[0-9]+\)[[:space:]]*$//' \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-._]+//; s/[-._]+$//' \
              | cut -c1-55 \
              | sed -E 's/[-._]+$//')"
          fi
          if [ -n "$SUFFIX" ]; then
            DESC="${SHORT_SHA}-${SUFFIX}"
          else
            DESC="${SHORT_SHA}"
          fi
          if ! printf '%s' "$DESC" | grep -Eq '^[A-Za-z0-9._-]{1,63}$'; then
            echo "Invalid description '$DESC' (must match ^[A-Za-z0-9._-]{1,63}\$)" >&2
            exit 1
          fi
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          echo "Description resolved: '$DESC'"

  staging-cloud:
    needs: detect
    if: inputs.skip_deploy != true
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      environment: staging-cloud
    secrets: inherit

  staging-firmware:
    needs: [detect, staging-cloud]
    if: ${{ !cancelled() && needs.detect.outputs.firmware_needed == 'true' }}
    uses: ./.github/workflows/deploy-firmware.yml
    with:
      environment: staging-firmware
      description: ${{ needs.detect.outputs.description }}
      hardwares: ${{ needs.detect.outputs.hardwares }}
      # Staging runs what it just built: the upload goes straight onto the alpha
      # channel of its device class. Production keeps the build on the shelf.
      set_alpha: true
    secrets: inherit

  # Uploads to the production server as it stands: waiting for the production
  # cloud deploy would mean waiting for its approval, which firmware never does.
  production-firmware:
    needs: [detect, staging-firmware]
    uses: ./.github/workflows/deploy-firmware.yml
    with:
      environment: production-firmware
      description: ${{ needs.detect.outputs.description }}
      hardwares: ${{ needs.detect.outputs.hardwares }}
    secrets: inherit

  production-cloud:
    needs: staging-cloud
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      environment: production-cloud
    secrets: inherit

  # A single build, not one per environment - there is nothing environment
  # specific about a Connect IQ app. It runs on a host rather than on the runner
  # because the store binds the app to the developer key it was first published
  # with, and that key lives in the host's env file. Nothing is deployed here:
  # the .iq is attached to the run for a manual store upload.
  garmin:
    needs: detect
    if: needs.detect.outputs.garmin_needed == 'true'
    runs-on: ubuntu-latest
    environment: garmin
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TERPCONTROL_ENV_FILE: ${{ vars.TERPCONTROL_ENV_FILE }}
      APP_NAME: terp-control-viewer-${{ needs.detect.outputs.description }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/sync-to-host
        with:
          environment: garmin
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Checked before building: an .iq signed with anything but the app's own
      # developer key is rejected by the store, so it is not worth attaching to
      # the run at all.
      - name: Check the Connect IQ signing key
        run: |
          set -euo pipefail
          # Resolved the way the build scripts do it: relative to the deploy path.
          ENV_FILE="${TERPCONTROL_ENV_FILE:-.env}"
          if ! ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_PATH}' && grep -Eq '^GARMIN_DEVELOPER_KEY_B64=.+' '${ENV_FILE}'"; then
            echo "GARMIN_DEVELOPER_KEY_B64 is not set in ${ENV_FILE} on ${DEPLOY_HOST}." >&2
            echo "Without it the build could only be signed with a throwaway key, which the Connect IQ store rejects." >&2
            exit 1
          fi

      - name: Build Connect IQ app on host
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && TERPCONTROL_ENV_FILE='${TERPCONTROL_ENV_FILE}' GARMIN_APP_NAME='${APP_NAME}' ./build-garmin.sh"

      - name: Fetch the .iq package
        run: |
          set -euo pipefail
          mkdir -p iq
          scp "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/garmin/bin/${APP_NAME}.iq" "iq/${APP_NAME}.iq"
          ls -l iq/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: iq/*.iq
          if-no-files-found: error
          retention-days: 90

      - name: Garmin summary
        run: |
          {
            echo ""
            echo "\`${APP_NAME}.iq\` is attached to this run as an artifact."
            echo "Download it and upload it manually at <https://apps.garmin.com/developer/dashboard>."
          } >> "$GITHUB_STEP_SUMMARY"
