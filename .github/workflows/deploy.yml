name: Deploy

# Pushes to master deploy to staging. Production is deploy-on-demand: run this
# workflow manually with target=production from the ref you want to promote.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target. Production runs wait for the approval configured on the "production" environment.'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      description:
        description: 'Firmware description suffix. Prefixed with short commit SHA; final FW_UPLOAD_VERSION is "<sha>-<this>". Max 55 chars, [A-Za-z0-9._-]. Leave blank to auto-derive a slug from the commit subject.'
        required: false
        type: string
        default: ''
      hardwares:
        description: 'Firmware variants to build (space-separated). Leave blank to auto-detect from changed paths. Use "none" to skip firmware.'
        required: false
        type: string
        default: ''
      skip_deploy:
        description: 'Skip webapp/server deploy step'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  ALL_HARDWARES: 'fridge controller plug fan light'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      hardwares: ${{ steps.resolve.outputs.hardwares }}
      firmware_needed: ${{ steps.resolve.outputs.firmware_needed }}
      description: ${{ steps.resolve.outputs.description }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'firmware/src/**'
              - 'firmware/include/**'
              - 'firmware/lib/**'
              - 'firmware/scripts/**'
              - 'firmware/boards/**'
              - 'firmware/platformio.ini'
              - 'firmware/default_*'
              - 'firmware/fg_partitions.csv'
              - 'firmware/pioenv.py'
              - 'fw-buildcontainer/**'
              - 'build-fw.sh'
            fridge:
              - 'firmware/src_hwtype/fridge/**'
            controller:
              - 'firmware/src_hwtype/controller/**'
            plug:
              - 'firmware/src_hwtype/plug/**'
            fan:
              - 'firmware/src_hwtype/fan/**'
            light:
              - 'firmware/src_hwtype/light/**'

      - name: Resolve target + hardwares + description
        id: resolve
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_HARDWARES: ${{ inputs.hardwares }}
          INPUT_DESCRIPTION: ${{ inputs.description }}
          CHG_SHARED: ${{ steps.changes.outputs.shared }}
          CHG_FRIDGE: ${{ steps.changes.outputs.fridge }}
          CHG_CONTROLLER: ${{ steps.changes.outputs.controller }}
          CHG_PLUG: ${{ steps.changes.outputs.plug }}
          CHG_FAN: ${{ steps.changes.outputs.fan }}
          CHG_LIGHT: ${{ steps.changes.outputs.light }}
        run: |
          set -euo pipefail

          # --- Target ---
          TARGET="${INPUT_TARGET:-staging}"
          if [ "$TARGET" != "staging" ] && [ "$TARGET" != "production" ]; then
            echo "Invalid target '$TARGET'" >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target resolved: '$TARGET'"

          # --- Hardwares ---
          if [ "${INPUT_HARDWARES}" = "none" ]; then
            HW=""
          elif [ -n "${INPUT_HARDWARES}" ]; then
            HW="${INPUT_HARDWARES}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            HW="${ALL_HARDWARES}"
          elif [ "${CHG_SHARED}" = "true" ]; then
            HW="${ALL_HARDWARES}"
          else
            HW=""
            [ "${CHG_FRIDGE}" = "true" ]     && HW="$HW fridge"
            [ "${CHG_CONTROLLER}" = "true" ] && HW="$HW controller"
            [ "${CHG_PLUG}" = "true" ]       && HW="$HW plug"
            [ "${CHG_FAN}" = "true" ]        && HW="$HW fan"
            [ "${CHG_LIGHT}" = "true" ]      && HW="$HW light"
          fi
          HW="$(echo "$HW" | xargs || true)"

          if [ -z "$HW" ]; then
            echo "firmware_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "firmware_needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "hardwares=$HW" >> "$GITHUB_OUTPUT"
          echo "Hardwares resolved: '$HW'"

          # --- Description ---
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [ -n "${INPUT_DESCRIPTION}" ]; then
            SUFFIX="${INPUT_DESCRIPTION}"
          else
            # Auto-slug from commit subject: strip trailing "(#NNN)", lowercase,
            # replace any run of non-[a-z0-9._-] with a single dash, trim dashes,
            # and cap at 55 chars so "<sha>-<slug>" fits the 63-char limit.
            SUBJECT="$(git log -1 --format=%s "${GITHUB_SHA}")"
            SUFFIX="$(printf '%s' "$SUBJECT" \
              | sed -E 's/[[:space:]]*\(#[0-9]+\)[[:space:]]*$//' \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-._]+//; s/[-._]+$//' \
              | cut -c1-55 \
              | sed -E 's/[-._]+$//')"
          fi
          if [ -n "$SUFFIX" ]; then
            DESC="${SHORT_SHA}-${SUFFIX}"
          else
            DESC="${SHORT_SHA}"
          fi
          if ! printf '%s' "$DESC" | grep -Eq '^[A-Za-z0-9._-]{1,63}$'; then
            echo "Invalid description '$DESC' (must match ^[A-Za-z0-9._-]{1,63}\$)" >&2
            exit 1
          fi
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          echo "Description resolved: '$DESC'"

  deploy:
    needs: detect
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ${{ needs.detect.outputs.target }}
      description: ${{ needs.detect.outputs.description }}
      hardwares: ${{ needs.detect.outputs.hardwares }}
      firmware_needed: ${{ needs.detect.outputs.firmware_needed == 'true' }}
      skip_deploy: ${{ inputs.skip_deploy == true }}
    secrets: inherit
