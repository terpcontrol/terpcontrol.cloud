name: Deploy cloud

# Rsyncs the repo to the host of the given environment and brings the compose
# stack up there.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Name of the GitHub environment holding the deployment settings'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time: a second one would rsync a newer
    # tree underneath the stack the first is still bringing up. A running
    # deploy is never cancelled - it would leave the stack half recreated.
    # While one runs, GitHub keeps only the newest waiting deploy and cancels
    # the ones it replaces, which loses nothing: every deploy ships the whole
    # tree of its commit.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TERPCONTROL_ENV_FILE: ${{ vars.TERPCONTROL_ENV_FILE }}
      COMPOSE_OPTIONS: ${{ vars.COMPOSE_OPTIONS }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/sync-to-host
        with:
          environment: ${{ inputs.environment }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          path: ${{ vars.DEPLOY_PATH }}
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # ./up.sh rather than the compose command it wraps, so a deploy and a
      # human on the host bring the stack up the same way - including the
      # force-recreate that keeps a container from outliving the image or the
      # env file it was started from.
      - name: Bring the stack up
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && COMPOSE_OPTIONS='${COMPOSE_OPTIONS}' TERPCONTROL_ENV_FILE='${TERPCONTROL_ENV_FILE}' ./up.sh"

      # The step above answers as soon as the containers are started, which says
      # nothing about whether the server it just shipped serves anything: a bad
      # environment or an unreachable database leaves it restarting forever
      # while the deploy reports success. The server's healthcheck calls
      # /readyz, so waiting for it is what makes a deploy that did not come
      # up a deploy that failed.
      #
      # Half an hour, because the first start after an upgrade that carries a
      # migration runs it before the server listens at all, and how long that
      # takes is a matter of how much data there is (a rehearsal's duration is
      # not it - server/src/migrations/README.md). Given up on sooner, a deploy
      # reports a failure while the server is still migrating, and a second
      # deploy recreates the container in the middle of it. A server that is up
      # is seen within one healthcheck interval, so only a deploy that does not
      # come up waits the whole time.
      - name: Wait for the server to report ready
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && COMPOSE_OPTIONS='${COMPOSE_OPTIONS}' TERPCONTROL_ENV_FILE='${TERPCONTROL_ENV_FILE}' ./scripts/wait-for-healthy.sh server 1800"
