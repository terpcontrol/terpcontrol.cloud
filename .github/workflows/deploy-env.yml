name: Deploy to environment

# Reusable deploy used by deploy.yml for both staging and production. Everything
# environment-specific comes from the GitHub environment named by the
# "environment" input - DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH,
# TERPCONTROL_ENV_FILE and COMPOSE_OPTIONS as environment variables, plus the
# SSH_PRIVATE_KEY secret - so the same job body serves every environment.
# Deploy and firmware upload share a single job so a protected environment only
# asks for one approval per run.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Name of the GitHub environment holding the deployment variables'
        required: true
        type: string
      description:
        description: 'FW_UPLOAD_VERSION for the firmware upload'
        required: false
        type: string
        default: ''
      hardwares:
        description: 'Firmware variants to build (space-separated)'
        required: false
        type: string
        default: ''
      firmware_needed:
        required: false
        type: boolean
        default: false
      skip_deploy:
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    if: inputs.skip_deploy != true || inputs.firmware_needed
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Per environment, so a production job still waiting for its approval does
    # not hold up the staging deploy of a later push.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TERPCONTROL_ENV_FILE: ${{ vars.TERPCONTROL_ENV_FILE }}
      COMPOSE_OPTIONS: ${{ vars.COMPOSE_OPTIONS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment variables
        run: |
          set -euo pipefail

          MISSING=""
          [ -n "${DEPLOY_HOST}" ] || MISSING="${MISSING} DEPLOY_HOST"
          [ -n "${DEPLOY_USER}" ] || MISSING="${MISSING} DEPLOY_USER"
          [ -n "${DEPLOY_PATH}" ] || MISSING="${MISSING} DEPLOY_PATH"
          if [ -n "${MISSING}" ]; then
            echo "Not set on the '${ENVIRONMENT}' environment:${MISSING}" >&2
            exit 1
          fi

          {
            echo "### Deploy to ${ENVIRONMENT}"
            echo ""
            echo "- host: \`${DEPLOY_USER}@${DEPLOY_HOST}\`"
            echo "- path: \`${DEPLOY_PATH}\`"
            echo "- env file: \`${TERPCONTROL_ENV_FILE:-(none)}\`"
            echo "- compose options: \`${COMPOSE_OPTIONS:-(none)}\`"
            echo "- ref: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync repo to host
        if: inputs.skip_deploy != true
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.pio/' \
            --exclude='**/dist/' \
            --exclude='**/build/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.idea/' \
            --exclude='.claude/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: docker compose up
        if: inputs.skip_deploy != true
        run: |
          ENV_FLAG=""
          if [ -n "${TERPCONTROL_ENV_FILE}" ]; then
            ENV_FLAG="--env-file ${TERPCONTROL_ENV_FILE}"
          fi
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose ${COMPOSE_OPTIONS} ${ENV_FLAG} up --build -d --remove-orphans"

      - name: Build + upload firmware on host
        if: inputs.firmware_needed
        env:
          FW_UPLOAD_VERSION: ${{ inputs.description }}
          HARDWARES: ${{ inputs.hardwares }}
        run: |
          set -euo pipefail
          echo "Building firmware variants on ${DEPLOY_HOST}: ${HARDWARES}"
          echo "FW_UPLOAD_VERSION=${FW_UPLOAD_VERSION}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && TERPCONTROL_ENV_FILE='${TERPCONTROL_ENV_FILE}' FW_UPLOAD_VERSION='${FW_UPLOAD_VERSION}' ./build-fw.sh ${HARDWARES}"
