<div class="tafel-paar">
  <div class="tafel-halbe" *ngFor="let halbe of haelften; trackBy: trackHalbe">
    <p class="tafel-kappe">{{ wort(halbe.kappe) }}</p>
    <div class="tafel-rahmen" [class]="'tafel-rahmen--' + halbe.beleg.art">
      <p class="tafel-karte-zeile" *ngFor="let zeile of halbe.beleg.text">{{ wort(zeile) }}</p>
      <p class="tafel-band-zeile" *ngFor="let wert of halbe.beleg.band; trackBy: trackBand">
        {{ 'zelt.beleg.band' | translate: bandParams(wert) }}
      </p>
      <!-- The thesis, drawn once: two boxes side by side, the left dashed,
           joined by a dotted arrow. It is the same mark wherever something is
           missing, at every density. -->
      <svg class="tafel-nichts" *ngIf="halbe.beleg.art === 'nichts'" viewBox="0 0 96 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4" />
        <rect x="57" y="1" width="38" height="38" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M42 20 H54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" />
        <path d="M50 16 L54 20 L50 24" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
    </div>
    <p class="tafel-bild-zeit" *ngIf="halbe.zeitZeigen">{{ halbe.moment | date: 'EEE dd.MM. HH:mm' }}</p>
    <p class="tafel-bild-kennung">
      {{ 'zelt.tag' | translate: { tag: halbe.tag } }} · <span class="tafel-kennung">{{ wort(halbe.beleg.kennung) }}</span>
    </p>
  </div>
</div>
