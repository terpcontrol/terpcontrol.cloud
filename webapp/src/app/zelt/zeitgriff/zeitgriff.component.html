<div class="griff" [class.griff--zieht]="zieht">
  <p class="griff-zeile">
    <span class="griff-anker">{{ (anker?.text?.key || 'zelt.griff.titel') | translate }}</span>
    <span class="griff-moment" *ngIf="!hinweis">
      {{
        (verschoben ? 'zelt.griff.verschoben' : 'zelt.griff.moment')
          | translate: { zeit: moment | date: 'EEE dd.MM. HH:mm', tag: tag }
      }}
    </span>
    <!-- The reply of `Nächster Unterschied` takes the same line rather than a new
         one: the control is 56 px on every Tafel and answering must not move it. -->
    <span class="griff-moment griff-hinweis" *ngIf="hinweis">{{ hinweis | translate }}</span>
    <button type="button" class="griff-naechster" (click)="naechster()">{{ 'zelt.griff.naechster' | translate }}</button>
  </p>

  <div
    #spur
    class="griff-spur"
    role="slider"
    tabindex="0"
    [attr.aria-label]="'zelt.griff.titel' | translate"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="100"
    [attr.aria-valuenow]="kopfProzent"
    [attr.aria-valuetext]="moment | date: 'EEE dd.MM. HH:mm'"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
    (keydown)="onKeydown($event)"
  >
    <svg class="griff-band" [attr.viewBox]="'0 0 ' + balken.length + ' 2'" preserveAspectRatio="none" aria-hidden="true">
      <rect
        *ngFor="let stab of balken; trackBy: trackBalken"
        class="griff-band-oben"
        [attr.x]="stab.x + 0.1"
        [attr.width]="0.8"
        [attr.y]="1 - stab.oben"
        [attr.height]="stab.oben"
      ></rect>
      <rect
        *ngFor="let stab of balken; trackBy: trackBalken"
        class="griff-band-unten"
        [attr.x]="stab.x + 0.1"
        [attr.width]="0.8"
        [attr.y]="1"
        [attr.height]="stab.unten"
      ></rect>
    </svg>

    <span class="griff-linie" aria-hidden="true"></span>
    <span
      class="griff-detent"
      *ngFor="let detent of detentliste; trackBy: trackDetent"
      [style.left.%]="prozent(detent.von)"
      [attr.title]="(detent.text.key || '') | translate"
      aria-hidden="true"
    ></span>
    <span class="griff-kopf" [style.left.%]="kopfProzent" aria-hidden="true"><span class="griff-knopf"></span></span>
  </div>
</div>
