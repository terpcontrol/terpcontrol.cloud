server {
  listen 0.0.0.0:80;
  root /app;

  # The image's own nginx.conf leaves this off, so the bundle and the two font
  # families would go out uncompressed. Pictures and videos are already
  # compressed and are not listed.
  gzip on;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css;
  gzip_min_length 1024;

  # The three files that decide what every other file is. `index.html` names the
  # hashed bundle, and the service worker holds the list of what it precached, so
  # a cached copy of either would pin a released version in place.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /sw.js {
    add_header Cache-Control "no-store";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-store";
  }

  # Vite names a built file `<name>-<8 char hash>.<ext>`, so its contents can
  # never change under that name. Workbox's own runtime is named the same way.
  location ~ "-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else served from `public/`: the catalogues, the icons, the
  # onboarding videos. They keep their names across releases, so they are cached
  # and revalidated rather than trusted for a year.
  location /assets/ {
    add_header Cache-Control "no-cache";
  }

  # One page, so every route the app owns has to arrive at it.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
