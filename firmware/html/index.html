<!doctype html>
<html lang="en">
  <head>
    <title>Terp Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

      input, button {
        -webkit-appearance: none; -moz-appearance: none;
        box-sizing: border-box;
        display: block;
        margin: 0;
        width: 100%; height: 40px;
        line-height: 40px; font-size: 17px;
        border: 1px solid #bbb;
      }

      button {
        margin-top: 5px;
      }

      html {
        font-family: sans-serif;
        font-size: 120%;
        line-height: 150%;
      }

      .hidden {
        display: none !important;
      }

      .box {
        box-sizing: border-box;
        width: 100%; height: 60px;
        display: flex;
        justify-content: center;
        flex-direction: column;
        border: 1px solid #bbb;
        text-align: center;
        margin-top: 5px;
      }

      .error {
        border: 1px solid #c66;
        background-color: #fcc;
      }

      .ok {
        border: 1px solid #6c6;
        background-color: #cfc;
      }

      #scancontent td + td {
        text-align: right;
      }

    </style>

    <script>

      function show(id, visible) {
        document.querySelector(id).classList.toggle('hidden', !visible);
      }

      function post(url, payload, onload) {
        var xhr = new XMLHttpRequest();
        xhr.open(payload ? 'POST' : 'GET', window.location.origin + url, true);
        xhr.onload = function() { onload(xhr.responseText); };
        xhr.send(payload);
      }

      function sendConfig() {
        show('#wifi-ui', false);
        show('#connected', false);
        show('#error', false);
        show('#connecting', true);

        let form_data = new FormData(document.querySelector('#wifi'));
        let payload = JSON.stringify({
          primary: {
            ssid: form_data.get('primary-ssid'),
            password: form_data.get('primary-password'),
          },
        });

        post('/config', payload, function(response) {
          let ok = response == 'ok';
          show('#connecting', false);
          show('#connected', ok);
          show('#error', !ok);
          show('#wifi-ui', !ok);
        });
      }

      function scanWifi() {
        let content = document.querySelector('#scancontent');
        content.innerHTML = '';
        show('#scanning', true);

        post('/scan', null, function(response) {
          let wifi = JSON.parse(response);
          show('#scanning', false);
          if(!wifi) return;

          for(let ssid of wifi) {
            let row = content.insertRow();
            row.insertCell().textContent = ssid;
            let select = document.createElement('button');
            select.textContent = 'Select';
            select.onclick = function() { selectWifi(ssid); };
            row.insertCell().appendChild(select);
          }

          show('#scan', true);
        });
      }

      function selectWifi(ssid) {
        document.querySelector('#primary-ssid').value = ssid;
        show('#scan', false);
      }

    </script>
  </head>

  <body>
    <h1>Terp Control</h1>
    <p>Connect your device to your WiFi network.</p>

    <div id="connecting" class="hidden box">
      <p>connecting...</p>
    </div>

    <div id="scanning" class="hidden box">
      <p>scanning...</p>
    </div>

    <div id="connected" class="hidden box ok">
      <p>connection successful</p>
    </div>

    <div id="error" class="hidden box error">
      <p>connection error</p>
    </div>

    <div id="scan" class="hidden" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-color: #cccccc53;">
      <div style="position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px; overflow: auto; background-color: #fff; border-radius: 5px;">
        <h3>Select Network</h3>
        <table style="width:90%;margin:5%" id="scancontent">
        </table>
        <button style="width:90%;margin:5%" type='button' onclick="show('#scan', false)">Abort</button>
      </div>
    </div>

    <div id="wifi-ui">
      <form id="wifi">
        <label for="primary-ssid">SSID</label>
        <input id="primary-ssid" type="text" name="primary-ssid" value="">
        <button type='button' onclick="scanWifi()">Scan</button>
        <label for="primary-password">Password</label>
        <input type="text" name="primary-password" value="">
      </form>
      <button type='button' onclick="sendConfig()">Save</button>
    </div>

  </body>

</html>
